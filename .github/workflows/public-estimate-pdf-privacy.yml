name: Public estimate PDF privacy regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/api/index.ts'
      - 'backend/api/src/utils/publicEstimateData.ts'
      - 'backend/api/__tests__/publicEstimatePdfPrivacy.test.ts'
      - '.github/workflows/public-estimate-pdf-privacy.yml'
  push:
    branches: [main]
    paths:
      - 'backend/api/index.ts'
      - 'backend/api/src/utils/publicEstimateData.ts'
      - 'backend/api/__tests__/publicEstimatePdfPrivacy.test.ts'
      - '.github/workflows/public-estimate-pdf-privacy.yml'
permissions:
  contents: read
jobs:
  offline-public-estimate-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - name: Install dependencies without scripts or real credentials
        working-directory: backend/api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify public estimate projection and PDF safety contract
        working-directory: backend/api
        run: npx jest --runInBand --runTestsByPath __tests__/publicEstimatePdfPrivacy.test.ts
