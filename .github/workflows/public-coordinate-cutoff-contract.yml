name: Public coordinate cutoff offline regression
on:
  push:
    branches: [security/public-coordinate-cutoff-opt-in-20261101]
  pull_request:
    branches: [main]
    paths:
      - 'backend/api/index.ts'
      - 'backend/api/src/utils/publicCoordinateWriteGuard.ts'
      - 'backend/api/__tests__/publicCoordinateWriteGuard.test.ts'
      - 'frontend/src/types/publicProperty.ts'
      - 'frontend/src/pages/PublicPropertyDetailPage.tsx'
      - 'frontend/src/pages/KujiraPropertyDetailPage.tsx'
      - '.github/workflows/public-coordinate-cutoff-contract.yml'
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - name: Install backend test dependencies without credentials
        working-directory: backend/api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify coordinate save cutoff contracts without network or DB
        working-directory: backend/api
        run: npx jest --runInBand --runTestsByPath __tests__/publicCoordinateWriteGuard.test.ts
