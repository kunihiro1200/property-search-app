name: Periodic Full Sync

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call authenticated property-sync endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Sync not started: GitHub Actions CRON_SECRET is not configured"
            exit 1
          fi

          # This is the confirmed production origin. The old /api/sync/trigger-async
          # path returned HTTP 404 in scheduled runs; /api/sync/trigger exists.
          url="https://property-site-frontend-kappa.vercel.app/api/sync/trigger"
          status=$(curl --silent --show-error --output /tmp/property-sync-response.json \
            --write-out "%{http_code}" --request POST "$url" \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' --max-time 30)
          echo "Sync trigger HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "Sync trigger failed; check backend domain, CRON_SECRET, and Vercel runtime logs"
            exit 1
          fi
          echo "Sync request accepted (HTTP 200). Verify asynchronous completion separately."
