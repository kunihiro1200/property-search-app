name: Legacy GAS reference offline security regression
on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/gas/property-listing-trigger-batch.gs'
      - 'backend/api/__tests__/legacySyncAuthPolicy.test.ts'
      - 'backend/api/src/utils/legacySyncAuthPolicy.ts'
      - '.github/workflows/legacy-gas-reference-offline.yml'
permissions:
  contents: read
jobs:
  legacy-gas-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - name: Install dependencies without credentials
        working-directory: backend/api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test GAS security contract offline (no credentials or HTTP requests)
        working-directory: backend/api
        run: npx jest --runInBand --runTestsByPath __tests__/legacySyncAuthPolicy.test.ts
