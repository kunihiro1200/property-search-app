name: Verify Public Coordinate Write Guard (draft only)

# Only branch-local CI. No environment secrets, production requests, sync,
# deployments, or database modifications.
on:
  push:
    branches:
      - security/public-coordinate-write-guard-20261031
    paths:
      - '.github/workflows/verify-public-coordinate-guard-draft.yml'
      - 'backend/api/src/utils/publicCoordinateWriteGuard.ts'
      - 'backend/api/index.ts'
      - 'backend/api/__tests__/publicCoordinateWriteGuard.test.ts'
permissions:
  contents: read

jobs:
  validate-anonymous-coordinate-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - name: Install only test dependencies
        working-directory: backend/api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run no-network coordinate validation tests
        working-directory: backend/api
        env:
          CI: 'true'
          CRON_SECRET: ''
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          GOOGLE_SERVICE_ACCOUNT_JSON: ''
        run: ./node_modules/.bin/jest --config jest.config.js --runInBand __tests__/publicCoordinateWriteGuard.test.ts
