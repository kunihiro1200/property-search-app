# Isolated, read-only tests for the draft completed-sync contract.
# Never uses repository secrets, Supabase, Google Sheets, Vercel or the sync API.
name: Verify Property Sync Draft (mock only)

on:
  push:
    branches:
      - fix/verified-sync-without-gas-change-20261030
    paths:
      - 'backend/api/__tests__/propertySyncCompletion.test.ts'
      - 'backend/api/__tests__/verifiedPropertySyncHttp.test.ts'
      - 'backend/api/__tests__/scheduledSyncInitialization.test.ts'
      - 'backend/api/__tests__/dedicatedSyncEntrypoint.test.ts'
      - 'backend/api/__tests__/dedicatedSyncConfig.test.ts'
      - 'backend/api/sync-verified.ts'
      - 'vercel.json'
      - '.github/workflows/scheduled-property-sync.yml'
      - 'backend/api/index.ts'
      - 'backend/api/src/services/PropertyListingSyncService.ts'
      - 'backend/api/src/routes/verifiedPropertySync.ts'
      - 'backend/api/src/utils/propertySyncCompletion.ts'
      - '.github/workflows/verify-property-sync-draft.yml'

permissions:
  contents: read

jobs:
  mocked-http-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout draft branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - name: Install test dependencies without lifecycle scripts
        working-directory: backend/api
        env:
          CI: 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run mocked success, failure and authorization tests
        working-directory: backend/api
        env:
          CI: 'true'
          CRON_SECRET: ''
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          GOOGLE_SERVICE_ACCOUNT_JSON: ''
        run: |
          ./node_modules/.bin/jest --config jest.config.js --runInBand --verbose \
            __tests__/propertySyncCompletion.test.ts \
            __tests__/verifiedPropertySyncHttp.test.ts \
            __tests__/scheduledSyncInitialization.test.ts \
            __tests__/dedicatedSyncEntrypoint.test.ts \
            __tests__/dedicatedSyncConfig.test.ts
