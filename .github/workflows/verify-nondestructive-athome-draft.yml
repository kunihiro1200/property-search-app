name: Verify Non-Destructive Athome Sync (draft only)
on:
  push:
    branches:
      - fix/preserve-property-details-on-comment-sync-20261031
    paths:
      - '.github/workflows/verify-nondestructive-athome-draft.yml'
      - 'backend/api/src/utils/nonDestructiveAthomeSync.ts'
      - 'backend/api/src/utils/publicCommentSyncGuard.ts'
      - 'backend/api/src/services/AthomeSheetSyncService.ts'
      - 'backend/api/src/services/PropertyDetailsService.ts'
      - 'backend/api/index.ts'
      - 'backend/api/__tests__/nonDestructiveAthomeSync.test.ts'
      - 'backend/api/__tests__/publicCommentSyncGuard.test.ts'
      - 'backend/api/__tests__/commentBackfillPolicy.test.ts'
permissions:
  contents: read
jobs:
  no-network-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout draft branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - name: Install dependencies without scripts
        working-directory: backend/api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run offline memo redaction and non-destructive update tests
        working-directory: backend/api
        env:
          CI: 'true'
          CRON_SECRET: ''
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          GOOGLE_SERVICE_ACCOUNT_JSON: ''
        run: ./node_modules/.bin/jest --config jest.config.js --runInBand __tests__/nonDestructiveAthomeSync.test.ts __tests__/publicCommentSyncGuard.test.ts __tests__/commentBackfillPolicy.test.ts
