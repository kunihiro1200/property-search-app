name: Verify Legacy Sync Auth Audit (draft only)

# No credentials, no production sync, no network calls from tests.
on:
  push:
    branches:
      - security/legacy-sync-audit-and-gate-20261031
    paths:
      - '.github/workflows/verify-legacy-sync-auth-audit-draft.yml'
      - 'backend/api/src/utils/legacySyncAuthPolicy.ts'
      - 'backend/api/__tests__/legacySyncAuthPolicy.test.ts'
      - 'backend/api/index.ts'

permissions:
  contents: read

jobs:
  audit-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - name: Install test dependencies without lifecycle scripts
        working-directory: backend/api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test source-only legacy sync auth policy
        working-directory: backend/api
        env:
          CI: 'true'
          CRON_SECRET: ''
          LEGACY_SYNC_TRIGGER_AUTH_REQUIRED: ''
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          GOOGLE_SERVICE_ACCOUNT_JSON: ''
        run: ./node_modules/.bin/jest --config jest.config.js --runInBand __tests__/legacySyncAuthPolicy.test.ts
