name: Verify Private Comment Backfill Preview (draft only)

# Isolated no-network tests. No secrets, no external API calls, no sync,
# and no production DB writes.
on:
  push:
    branches:
      - security/internal-comment-backfill-preview-20261031
    paths:
      - '.github/workflows/verify-internal-comment-backfill-draft.yml'
      - 'backend/api/index.ts'
      - 'backend/api/src/utils/commentBackfillPolicy.ts'
      - 'backend/api/__tests__/commentBackfillPolicy.test.ts'

permissions:
  contents: read

jobs:
  check-preview-and-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - name: Install tests without lifecycle scripts
        working-directory: backend/api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test preview-only backfill policy without credentials
        working-directory: backend/api
        env:
          CI: 'true'
          CRON_SECRET: ''
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          GOOGLE_SERVICE_ACCOUNT_JSON: ''
          COMMENT_BACKFILL_EXECUTION_ENABLED: ''
        run: ./node_modules/.bin/jest --config jest.config.js --runInBand __tests__/commentBackfillPolicy.test.ts
