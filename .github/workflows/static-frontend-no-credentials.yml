name: Static frontend must not bundle server credentials
on:
  push:
    branches: [security/static-frontend-no-service-account-20261101]
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - 'frontend/scripts/assert-no-service-credential-bundle.mjs'
      - '.github/workflows/static-frontend-no-credentials.yml'
permissions:
  contents: read
jobs:
  no-server-secret-in-static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install without lifecycle scripts
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build with a synthetic server credential (not a real key)
        working-directory: frontend
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: TEST_ONLY_SERVER_CREDENTIAL_DO_NOT_USE_20261101
          FAKE_CREDENTIAL_MARKER: TEST_ONLY_SERVER_CREDENTIAL_DO_NOT_USE_20261101
        run: |
          npm run build
          node scripts/assert-no-service-credential-bundle.mjs
