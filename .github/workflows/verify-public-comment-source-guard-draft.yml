name: Verify Public Comment Source Guard (draft only)

on:
  push:
    branches:
      - security/public-comment-source-guard-20261031
    paths:
      - '.github/workflows/verify-public-comment-source-guard-draft.yml'
      - 'backend/api/index.ts'
      - 'backend/api/__tests__/publicCommentSourceGuard.test.ts'

permissions:
  contents: read

jobs:
  offline-public-sync-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - name: Install test dependencies without lifecycle scripts
        working-directory: backend/api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run zero-network source guard and public sync regressions
        working-directory: backend/api
        env:
          CI: 'true'
          CRON_SECRET: ''
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          GOOGLE_SERVICE_ACCOUNT_JSON: ''
          PUBLIC_COMMENT_SYNC_DISABLED: ''
          COMMENT_BACKFILL_EXECUTION_ENABLED: ''
        run: ./node_modules/.bin/jest --config jest.config.js --runInBand __tests__/publicCommentSourceGuard.test.ts __tests__/publicCommentSyncGuard.test.ts __tests__/commentBackfillPolicy.test.ts __tests__/nonDestructiveAthomeSync.test.ts
