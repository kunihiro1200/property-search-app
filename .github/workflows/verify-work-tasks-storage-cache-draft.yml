name: Verify Work Tasks Storage Cache (draft only)

# Isolated tests; no real Google Sheets API calls, no service account secrets,
# no DB writes and no deployments.
on:
  push:
    branches:
      - fix/work-tasks-sheets-singleflight-cache-20261031
    paths:
      - '.github/workflows/verify-work-tasks-storage-cache-draft.yml'
      - 'backend/api/src/utils/WorkTasksStorageCache.ts'
      - 'backend/api/src/services/PropertyListingService.ts'
      - 'backend/api/__tests__/workTasksStorageCache.test.ts'

permissions:
  contents: read

jobs:
  test-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - name: Install tests without lifecycle scripts
        working-directory: backend/api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run no-network cache tests
        working-directory: backend/api
        env:
          CI: 'true'
          GOOGLE_SERVICE_ACCOUNT_JSON: ''
          SUPABASE_URL: ''
          SUPABASE_SERVICE_KEY: ''
        run: ./node_modules/.bin/jest --config jest.config.js --runInBand __tests__/workTasksStorageCache.test.ts
