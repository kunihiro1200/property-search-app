name: Property Google Sheets credential safety
on:
  push:
    branches: [security/stop-property-sheets-credential-logging-20261101]
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/services/GoogleSheetsClient.ts'
      - 'backend/api/src/services/GoogleSheetsClient.ts'
      - 'backend/src/services/__tests__/GoogleSheetsClientAuthCompatibility.test.ts'
      - 'backend/src/services/__tests__/GoogleSheetsClientCredentialLogging.test.ts'
      - 'backend/jest.credential-safety.config.js'
      - '.github/workflows/property-google-credential-safety.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install without lifecycle scripts or audit networking
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Google Sheets auth compatibility and logging
        working-directory: backend
        run: npx jest --config jest.credential-safety.config.js --runInBand
