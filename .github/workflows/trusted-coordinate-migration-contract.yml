name: Verify trusted coordinate source offline
on:
  push:
    branches: [security/trusted-coordinate-preview-first-20261101]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - name: Install without secrets and lifecycle hooks
        working-directory: backend/api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify trusted coordinate source and guarded backfill
        working-directory: backend/api
        run: npx jest --runInBand --runTestsByPath __tests__/trustedCoordinateMigration.test.ts
