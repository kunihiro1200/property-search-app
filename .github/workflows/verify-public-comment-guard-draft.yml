name: Verify Public Comment Sync Guard (draft only)

# No runtime secrets, no external API calls, no Google Sheets access, no DB writes.
on:
  push:
    branches:
      - security/public-comment-sync-hardening-20261031
    paths:
      - '.github/workflows/verify-public-comment-guard-draft.yml'
      - 'backend/api/index.ts'
      - 'backend/api/src/utils/publicCommentSyncGuard.ts'
      - 'backend/api/__tests__/publicCommentSyncGuard.test.ts'

permissions:
  contents: read

jobs:
  check-public-comment-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout draft branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - name: Install isolated test dependencies
        working-directory: backend/api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run source-only and simulated-concurrency tests
        working-directory: backend/api
        env:
          CI: 'true'
          CRON_SECRET: ''
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          GOOGLE_SERVICE_ACCOUNT_JSON: ''
        run: ./node_modules/.bin/jest --config jest.config.js --runInBand __tests__/publicCommentSyncGuard.test.ts
